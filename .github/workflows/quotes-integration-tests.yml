name: Quotes API integration tests

on:
  push:
    paths:
      - 'day-1/piece2/QuotesApi/**'
      - 'day-1/piece2/Quotes.Tests.Integration/**'
      - '.github/workflows/quotes-integration-tests.yml'
  pull_request:
    paths:
      - 'day-1/piece2/QuotesApi/**'
      - 'day-1/piece2/Quotes.Tests.Integration/**'
      - '.github/workflows/quotes-integration-tests.yml'

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify Docker is available
        run: docker version

      - name: Restore integration test dependencies
        run: dotnet restore day-1/piece2/Quotes.Tests.Integration/Quotes.Tests.Integration.csproj

      - name: Run SQL Server Testcontainers integration tests
        run: >-
          dotnet test day-1/piece2/Quotes.Tests.Integration/Quotes.Tests.Integration.csproj
          --configuration Release
          --no-restore
