name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      # Jwt:SigningKey never lives in appsettings.json or this file - it's a repo
      # secret, injected as an env var (the highest-precedence config source),
      # mirroring how a real deployment would supply it via a Key Vault reference.
      Jwt__SigningKey: ${{ secrets.JWT_SIGNING_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore day-1/piece2/Piece2.slnx

      - name: Build
        run: dotnet build day-1/piece2/Piece2.slnx --no-restore

      - name: Test with coverage
        run: >
          dotnet test day-1/piece2/Piece2.slnx
          --no-build
          --logger "trx;LogFilePrefix=test-results"
          --collect:"XPlat Code Coverage"
          --settings day-1/piece2/CodeCoverage.runsettings
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults/**/*.trx

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ./TestResults/**/coverage.cobertura.xml

      - name: Check coverage
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          files = glob.glob("TestResults/**/coverage.cobertura.xml", recursive=True)

          if not files:
              print("No coverage file found.")
              sys.exit(1)

          # Multiple test projects (unit, integration, and legacy suites) all exercise
          # the same QuotesApi source, so each report covers the same lines. Summing
          # lines-valid/lines-covered across reports would multiply the denominator
          # and understate real coverage. Instead, merge by (file, line) and take the
          # max hit count seen across all reports before computing the ratio.
          line_hits = {}
          for file in files:
              root = ET.parse(file).getroot()
              for cls in root.iter("class"):
                  filename = cls.attrib.get("filename")
                  lines = cls.find("lines")
                  if lines is None:
                      continue
                  for line in lines:
                      number = int(line.attrib["number"])
                      hits = int(line.attrib["hits"])
                      key = (filename, number)
                      line_hits[key] = max(line_hits.get(key, 0), hits)

          total_valid = len(line_hits)
          total_covered = sum(1 for hits in line_hits.values() if hits > 0)

          if total_valid == 0:
              print("Coverage contains no executable lines.")
              sys.exit(1)

          coverage = total_covered / total_valid * 100

          print(f"Merged line coverage: {total_covered}/{total_valid} = {coverage:.2f}%")

          if coverage < 70:
              print("Coverage is below the required 70% threshold.")
              sys.exit(1)

          print("Coverage gate passed.")
          PY
